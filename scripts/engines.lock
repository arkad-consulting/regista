# Regista engines.lock — every external artifact scripts/install.sh fetches, pinned, with its SHA256.
# Read by scripts/install.sh and scripts/doctor.sh (bash 3.2: split on " | ").
#
# Supply-chain rule: an artifact is pinned only if it was released >= 14 days before its pin date.
# doctor.sh re-checks that rule on every line. To bump an engine: change version/url/sha256/released,
# set pinned to the day you adopt it, run scripts/doctor.sh, commit.
#
# Columns:  id | version | released | pinned | sha256 | size (bytes) | url
#   - released/pinned are YYYY-MM-DD; "-" means not applicable.
#   - url "brew:<formula>" = installed with Homebrew (bottles are not pinnable): version is the
#     MINIMUM accepted, the installer warns below it. sha256/size "-" for those.
#   - url "repo:<path>" = a file shipped in this repository (sha256 guards accidental edits).
#
# Pinned on 2026-11-01 with the engines (issue #8) and on 2026-11-02 with the installer (issue #12).

