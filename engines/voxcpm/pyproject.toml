# VoxCPM2 environment for Regista's voice-over (Medium tier and up): `generate.run {kind: voice}` through vox_say.py.
# Same resolution as the prototype that made the 2026-11 reels. The installer (issue #38)
# will copy this folder to ~/Library/Application Support/Regista/engines/voxcpm
# and run `uv sync --frozen`. Never add litellm.
[project]
name = "regista-voxcpm"
version = "0.1.0"
description = "VoxCPM2 voice-over in a cloned voice for Regista (vox_say.py)"
requires-python = "==3.12.*"
dependencies = [
    "voxcpm==2.0.3",
]

[tool.uv]
# Supply-chain buffer: only resolve packages published >= 2 weeks before the pin date (2026-11-06).
exclude-newer = "2026-10-23T00:00:00Z"
package = false
